<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Breadcrumb — a trail of bookmarks showing where you left off">
  <rect width="1200" height="600" fill="#050816" />
  <!-- faint background grid -->
  <g stroke="#0f1b33" stroke-width="1">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200" />
    <path d="M100 0v600M200 0v600M300 0v600M400 0v600M500 0v600M600 0v600M700 0v600M800 0v600M900 0v600M1000 0v600M1100 0v600" />
  </g>
  <!-- breadcrumb trail: dashed path winding left -> right -->
  <path d="M180 300 C 320 180, 430 420, 570 300 S 820 180, 1020 300" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="10 12" opacity="0.55" stroke-linecap="round" />
  <!-- breadcrumb dots along the trail -->
  <circle cx="180" cy="300" r="9" fill="#3f5b7a" />
  <circle cx="300" cy="238" r="7" fill="#3f5b7a" />
  <circle cx="430" cy="372" r="7" fill="#3f5b7a" />
  <circle cx="570" cy="300" r="9" fill="#3f5b7a" />
  <circle cx="700" cy="238" r="7" fill="#3f5b7a" />
  <circle cx="830" cy="372" r="7" fill="#3f5b7a" />
  <!-- the "where you left off" marker: bright bookmark -->
  <g transform="translate(1020 300)">
    <path d="M -18 -26 h 36 v 52 l -18 -12 l -18 12 z" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round" />
    <path d="M -12 -14 h 24" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
    <path d="M -12 -2 h 16" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  </g>
  <!-- soft glow at the destination -->
  <circle cx="1020" cy="300" r="64" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.18" />
  <circle cx="1020" cy="300" r="100" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.08" />
</svg>
